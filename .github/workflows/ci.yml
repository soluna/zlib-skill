name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.10", "3.11", "3.12", "3.13", "3.14"]

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install --require-hashes -r scripts/requirements.lock
          python -m pip install -r requirements-dev.txt

      - name: Lint
        run: |
          ruff check .
          ruff format --check .

      - name: Test and coverage
        run: |
          pytest -q --cov=plugins/zlib-skill/scripts --cov=evals --cov-report=json:/tmp/zlib-coverage.json
          python scripts/check_coverage.py /tmp/zlib-coverage.json

  package:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Create clean Skill directory
        run: |
          mkdir -p /tmp/codex-home/skills/zlib-skill
          git archive HEAD | tar -x -C /tmp/codex-home/skills/zlib-skill

      - name: Smoke-test self-contained Skill
        run: |
          export SKILL_DIR=/tmp/codex-home/skills/zlib-skill
          export ZLIB_SKILL_RUNTIME_DIR=/tmp/zlib-skill-runtime
          export ZLIB_SKILL_CONFIG_DIR=/tmp/zlib-skill-config
          python "$SKILL_DIR/scripts/run.py" --version
          python "$SKILL_DIR/scripts/run.py" auth status --json > /tmp/auth-first.json
          python "$SKILL_DIR/scripts/run.py" auth status --json > /tmp/auth-second.json
          python - <<'PY'
          import json
          from pathlib import Path

          first = json.loads(Path("/tmp/auth-first.json").read_text())
          second = json.loads(Path("/tmp/auth-second.json").read_text())
          assert first == second
          assert first["ok"] is True
          assert first["schema_version"] == "2"
          assert first["skill_version"] == "0.3.1"
          assert first["zlib"]["has_token"] is False
          assert len(list(Path("/tmp/zlib-skill-runtime").glob("*/.ready.json"))) == 1
          PY
      - name: Validate plugin manifest
        run: python plugins/zlib-skill/scripts/validate_plugin_manifest.py .

  security:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Install audit tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install pip-audit detect-secrets bandit

      - name: Audit dependencies
        run: pip-audit -r scripts/requirements.lock

      - name: Run static security checks
        run: bandit -q -r scripts/run.py scripts/zlib_anna -ll

      - name: Scan tracked files for secrets
        run: |
          git ls-files -z | xargs -0 detect-secrets scan \
            | python -c 'import json,sys; data=json.load(sys.stdin); raise SystemExit(bool(data["results"]))'
